name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub's runner images generally ship a recent Android SDK, but not always the exact
      # platform/build-tools this project targets — install idempotently rather than assume.
      - name: Ensure required Android SDK packages are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      # No release-signing config exists yet (see CLAUDE.md - only assembleDebug is documented),
      # so this publishes the debug build. Switch to a signed assembleRelease build here once
      # a keystore + signing config are set up.
      - name: Rename APK for the release asset
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk \
            "dist/currency-mobile-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/currency-mobile-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
