name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GitHub's runner images generally ship a recent Android SDK, but not always the exact
      # platform/build-tools this project targets — install idempotently rather than assume.
      - name: Ensure required Android SDK packages are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Builds the Android debug APK and runs the shared/Android unit test suite in one Gradle
      # invocation. Does not (and cannot, on Linux) build or test the iOS target — see README.
      - name: Build and test
        run: ./gradlew :composeApp:assembleDebug :composeApp:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: composeApp/build/reports/tests/
